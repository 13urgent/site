name: Marketing 13 URGENT
on:
  push:
    branches: [main]
    paths: [.github/workflows/marketing-13urgent.yml, marketing/probe.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    name: Verifier Buffer sans publier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lire les comptes Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing/probe.py
