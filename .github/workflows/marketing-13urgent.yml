name: Marketing 13 URGENT
on:
  push:
    branches: [main]
    paths: [.github/workflows/marketing-13urgent.yml, 'marketing/**']
  workflow_dispatch:
    inputs:
      mode:
        description: Lecture seule ou programmation automatique
        type: choice
        options: [probe, publish]
        default: probe
  schedule:
    # Gate in Python keeps only the 8am Europe/Paris window, including DST.
    - cron: '0 6,7 * * *'
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  daily:
    name: Preparer et programmer les publications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marketing/requirements.txt
      - name: Installer Pillow
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check --timeout 20 --retries 2 -r marketing/requirements.txt
      - name: Verifier FFmpeg
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verifier les textes et la protection contre les doublons
        run: |
          python marketing/content/validate_content.py
          python -m unittest discover -s marketing/publisher -p 'test_*.py'
          python -m unittest discover -s marketing -p test_pipeline.py
      - name: Produire et programmer sans intervention manuelle
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python marketing/pipeline.py --mode "$RUN_MODE" --scheduled
          else
            python marketing/pipeline.py --mode "$RUN_MODE"
          fi
      - name: Conserver les videos produites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-13urgent
          path: |
            .runtime/output/*/*.mp4
            .runtime/output/*/cover.jpg
            .runtime/output/*/storyboard.jpg
            .runtime/output/*/manifest.json
          if-no-files-found: ignore
          retention-days: 7
