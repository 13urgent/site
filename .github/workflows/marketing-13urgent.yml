name: Marketing 13 URGENT — deux publications par jour
on:
  push:
    branches: [main]
    paths: [.github/workflows/marketing-13urgent.yml, 'marketing/**']
  workflow_dispatch:
    inputs:
      mode:
        description: Controle, migration des anciens posts ou remplissage automatique
        type: choice
        options: [probe, verify, migrate, publish, preview]
        default: probe
      date:
        description: Debut du calendrier facultatif AAAA-MM-JJ
        type: string
        required: false
  schedule:
    - cron: '10 5,6,7 * * *'
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  daily:
    name: Deux videos par reseau, voix et musique, file glissante gratuite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marketing/requirements.txt
      - name: Installer Pillow
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check --timeout 20 --retries 2 -r marketing/requirements.txt
      - name: Verifier FFmpeg
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 300 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Verifier catalogue, cadence, compatibilite et anti-doublons
        run: |
          python -m unittest discover -s marketing/publisher -p 'test_*.py'
          python -m unittest discover -s marketing -p test_rotation.py
          python -m unittest discover -s marketing -p test_daily_v2.py
          python -m unittest discover -s marketing -p test_pipeline.py
      - name: Controler ou remplir le calendrier sans intervention manuelle
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'push' && 'probe' || 'publish' }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DATE: ${{ inputs.date }}
          MARKETING_FONT_DIR: marketing/video/assets/fonts
          MARKETING_MEDIA_CACHE: .runtime/approved-sources
        run: |
          args=(--mode "$RUN_MODE")
          if [ "$EVENT_NAME" = schedule ]; then args+=(--scheduled); fi
          if [ -n "$REQUESTED_DATE" ]; then args+=(--date "$REQUESTED_DATE"); fi
          python marketing/daily_v2.py "${args[@]}"
      - name: Conserver les preuves audio et le calendrier filtre
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-daily2-proof
          path: |
            .runtime/daily2-result.json
            .runtime/output/*/manifest.json
            .runtime/output/*/cover.jpg
          if-no-files-found: ignore
          retention-days: 7
