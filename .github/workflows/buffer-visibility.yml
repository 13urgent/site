name: Programmer quatre publications commerciales autorisees
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier les espacements et la confidentialite du calendrier
        run: python -m unittest discover -s marketing -p test_commercial_planning_20261126.py
      - name: Programmer les quatre posts apres controle du calendrier
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing/commercial_planning_20261126.py --mode publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-planning-public-report
          path: .runtime/commercial-planning-report.json
          if-no-files-found: ignore
          retention-days: 3
