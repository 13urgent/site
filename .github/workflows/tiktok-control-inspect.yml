name: Publier le post TikTok testeurs explicitement valide
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  publish:
    name: Publier uniquement le TikTok testeurs valide
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier l’anti-doublon et les disclosures TikTok
        run: python -m unittest discover -s marketing -p test_tiktok_testers_20261123.py
      - name: Publier le seul post TikTok et verifier son accusé
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing/send_tiktok_testers_20261123.py
