name: Inspecter les options de pause TikTok sans publier
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lire uniquement le schema des commandes Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python tools/tiktok_control_inspect.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tiktok-control-schema
          path: .runtime/tiktok-control-schema.json
          retention-days: 1
