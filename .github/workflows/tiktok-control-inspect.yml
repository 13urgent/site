name: Publier la presentation Mon Exploit brochure sur TikTok
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  publish:
    name: Publier uniquement le TikTok brochure autorise
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier l’anti-doublon et la declaration IA
        run: python -m unittest discover -s marketing -p test_tiktok_monexploit_brochure_20261126.py
      - name: Publier le seul TikTok autorise et verifier son accuse
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python marketing/send_tiktok_monexploit_brochure_20261126.py
