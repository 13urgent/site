name: Relance commerciale unique après sept jours
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les exclusions et l’absence de relance répétée
        run: python -m unittest discover -s mailing -p test_commercial_followup.py
      - name: Actualiser les réponses puis traiter les seules relances autorisées
        env:
          CONTACT_MAIL_PASSWORD: ${{ secrets.CONTACT_MAIL_PASSWORD }}
        run: python mailing/commercial_followup.py
