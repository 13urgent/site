name: Envoyer les campagnes commerciales entre 10h et 18h Paris
on:
  workflow_dispatch:
  schedule:
    - cron: '5 8,9,12,15,16 * * 1-5'
permissions:
  contents: write
concurrency:
  group: marketing-13urgent
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les horaires et la file chiffrée
        run: python -m unittest discover -s mailing -p 'test_commercial_*.py'
      - name: Envoyer les seuls lots vérifiés déjà autorisés
        env:
          CONTACT_MAIL_PASSWORD: ${{ secrets.CONTACT_MAIL_PASSWORD }}
        run: python mailing/commercial_queue.py
