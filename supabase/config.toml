# Les fonctions vérifient elles-mêmes les identités/signatures :
# Checkout appelle /auth/v1/user ; le webhook vérifie Stripe-Signature sur le corps brut.
[functions.billing-checkout]
verify_jwt = false

[functions.billing-webhook]
verify_jwt = false

# Authentification par secret serveur distinct, vérifiée dans la fonction.
[functions.registration-alerts]
verify_jwt = false
